name: Unified Agent Skills

on:
  pull_request:
    paths:
      - "skills/**"
      - "workflows/**"
      - "registry/**"
      - "reviewers/**"
      - "policies/**"
      - "templates/**"
      - "adapters/**"
      - "tools/**"
      - "scripts/**"
      - "tests/**"
      - "docs/**"
      - "README*"
      - ".github/workflows/agent-workflows-validate.yml"
  push:
    branches: ["feat/unified-skills-architecture", "feat/portable-agent-workflows", "main"]

permissions:
  contents: read

jobs:
  validate:
    name: Registry, bilingual docs, installer and routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry and ordering
        run: python3 scripts/validate-skills.py
      - name: Validate bilingual guides
        run: python3 scripts/generate-docs.py --check
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
