workflows:
  new-feature:
    route: NEW_FEATURE
    description: .agents/workflow/workflows/new-feature.md
    sequence: [grill, "domain-modeling?", feature-design, "architecture-decision?", doc-impact, to-spec, "to-tickets?", implement, "security-audit?", "accessibility-audit?", "performance-audit?", verify, code-review, "decision-capture?", doc-sync, handoff]

  bugfix:
    route: BUGFIX
    description: .agents/workflow/workflows/bugfix.md
    sequence: [diagnose-bug, "tdd?", implement, "security-audit?", "accessibility-audit?", "performance-audit?", verify, code-review, "decision-capture?", "doc-sync?", handoff]

  architecture-change:
    route: ARCHITECTURE_CHANGE
    description: .agents/workflow/workflows/architecture-change.md
    sequence: [grill, architecture-decision, doc-impact, to-spec, "to-tickets?", implement, "security-audit?", "accessibility-audit?", "performance-audit?", verify, code-review, decision-capture, doc-sync, handoff]

  new-project:
    route: NEW_PROJECT
    description: .agents/workflow/workflows/new-project.md
    sequence: [project-bootstrap, project-discovery, "domain-modeling?", "architecture-decision?", to-spec, doc-impact, "to-tickets?", implement, "security-audit?", "accessibility-audit?", "performance-audit?", verify, code-review, "decision-capture?", doc-sync, handoff]

  legacy-project:
    route: LEGACY_ONBOARDING
    description: .agents/workflow/workflows/legacy-project.md
    sequence: [legacy-onboarding, project-audit, handoff]

  review-only:
    route: REVIEW_ONLY
    description: .agents/workflow/workflows/review-only.md
    sequence: [code-review]

  project-audit:
    route: PROJECT_AUDIT
    description: .agents/workflow/workflows/existing-project.md
    sequence: [project-audit, handoff]

  refactor:
    route: REFACTOR
    description: .agents/workflow/workflows/refactor.md
    sequence: ["architecture-decision?", "doc-impact?", implement, verify, code-review, "decision-capture?", "doc-sync?", handoff]

  security-change:
    route: SECURITY_CHANGE
    description: .agents/workflow/workflows/security-change.md
    sequence: [grill, "architecture-decision?", doc-impact, to-spec, implement, "threat-model?", "privacy-review?", "secrets-safety?", security-audit, verify, code-review, "decision-capture?", doc-sync, handoff]

  docs-only:
    route: DOCS_ONLY
    description: .agents/workflow/workflows/docs-only.md
    sequence: [doc-impact, doc-sync, verify, code-review, handoff]

  implement-approved-spec:
    route: IMPLEMENT_APPROVED_SPEC
    description: .agents/workflow/workflows/implement-approved-spec.md
    sequence: [doc-impact, "to-tickets?", implement, "security-audit?", "accessibility-audit?", "performance-audit?", verify, code-review, "decision-capture?", doc-sync, handoff]

  large-initiative:
    route: LARGE_INITIATIVE
    description: .agents/workflow/workflows/large-initiative.md
    sequence: ["project-discovery?", grill, map-initiative, "domain-modeling?", feature-design, "architecture-decision?", doc-impact, to-spec, to-tickets, implement, "security-audit?", "accessibility-audit?", "performance-audit?", verify, code-review, "decision-capture?", doc-sync, handoff]

  ticket-execution:
    route: TICKET_EXECUTION
    description: .agents/workflow/workflows/ticket-execution.md
    sequence: [ticket-intake, ticket-triage]

  marketing-campaign:
    route: MARKETING_CAMPAIGN
    description: .agents/workflow/workflows/marketing-campaign.md
    sequence: [marketing-strategy, campaign-planning, "content-marketing?", "landing-page-optimization?", "technical-seo?", "paid-media-review?", "privacy-review?", "analytics-attribution?", "crm-lifecycle?", "growth-experimentation?", "implement?", verify, code-review, handoff]

  seo-review:
    route: SEO_REVIEW
    description: .agents/workflow/workflows/seo-review.md
    sequence: [seo-guardian, technical-seo, "accessibility-audit?", "performance-audit?", verify, handoff]

  security-audit:
    route: SECURITY_AUDIT
    description: .agents/workflow/workflows/security-audit.md
    sequence: ["threat-model?", "secrets-safety?", "dependency-audit?", "privacy-review?", security-audit, verify, handoff]

  release-review:
    route: RELEASE_REVIEW
    description: .agents/workflow/workflows/release-review.md
    sequence: [release-readiness, "security-audit?", "privacy-review?", "performance-audit?", verify, handoff]

conditions:
  tdd:
    run_when: [useful_deterministic_regression_seam]
  project-discovery:
    run_when: [product_purpose_or_scope_unclear]
  doc-impact:
    run_when: [permanent_project_truth_may_change]
  to-tickets:
    run_when:
      - user_requested_ticketing
      - task_size == large
      - task_size == initiative
      - independent_delivery_units > 1
  domain-modeling:
    run_when:
      - domain_terms_or_entities_change
  architecture-decision:
    run_when:
      - material_architecture_choice
  decision-capture:
    run_when:
      - durable_decision_emerged
  doc-sync:
    run_when:
      - permanent_project_truth_changed

  implement:
    run_when: [explicit_implementation_requested_and_authorized]
  security-audit:
    run_when: [security_risk_or_security_review_explicit]
  threat-model:
    run_when: [new_trust_boundary_or_critical_security_design]
  secrets-safety:
    run_when: [secrets_or_environment_credentials_affected]
  dependency-audit:
    run_when: [dependencies_or_supply_chain_affected]
  privacy-review:
    run_when: [personal_data_tracking_or_consent_affected]
  technical-seo:
    run_when: [public_indexable_landing_page_or_SEO_scope]
  accessibility-audit:
    run_when: [UI_interaction_or_accessibility_scope]
  performance-audit:
    run_when: [performance_budget_or_load_affected]
  content-marketing:
    run_when: [content_or_campaign_copy_needed]
  landing-page-optimization:
    run_when: [landing_page_in_scope]
  paid-media-review:
    run_when: [paid_media_campaign_or_account_changes]
  analytics-attribution:
    run_when: [tracking_or_lead_to_revenue_attribution_needed]
  crm-lifecycle:
    run_when: [lead_nurture_or_CRM_hand_off]
  growth-experimentation:
    run_when: [experiment_requested]

